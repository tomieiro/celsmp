[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celsmp"
version = "0.2.0"
description = "CelSMP: Cellular Storage Model Protocol for model storage and inference distribution"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
dev = ["pytest>=8", "torch>=2.1"]

[project.scripts]
celsmp = "celsmp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
celsmp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
